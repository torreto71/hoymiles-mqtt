name: docker image

on:
  push:
    branches: [ main, 'fix/**' ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies pinned by poetry.lock
        run: |
          pip install poetry==2.5.1 poetry-plugin-export==1.10.1
          poetry export --only main --output requirements.txt
          pip install --require-hashes -r requirements.txt
          pip install --no-deps -e .
          pip install pytest
      - name: Test
        run: pytest -vv tests

  # informative only: tells when the newest dependencies become compatible again
  test-latest-dependencies:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the newest dependencies
        run: |
          pip install -e . pytest
          pip install --upgrade pymodbus hoymiles-modbus
          pip list
      - name: Test
        run: pytest -vv tests

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
